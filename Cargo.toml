[package]
name = "matrix-mcp"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Remote MCP server exposing Matrix (kampong.social) to claude.ai"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jlxq0/matrix-mcp"
publish = false

[dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal", "net"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
# Optimise for binary size + decent perf; we're an HTTP server, not a CPU
# crucher. Slimmer binaries → smaller container images, faster cold starts.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[lints.clippy]
# Reasonable defaults; tighten as the codebase grows.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
# Acceptable in pragma-heavy code:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "forbid"
