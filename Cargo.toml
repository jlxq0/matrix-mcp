[package]
name = "matrix-mcp"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
description = "Remote MCP server exposing Matrix (kampong.social) to claude.ai"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jlxq0/matrix-mcp"
publish = false

[dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "rt", "signal", "net", "time"] }
axum = "0.7"
# `axum-extra` for typed Cookie / CookieJar extractors in the /setup web
# flow. `Form` is also re-exported here in case we need it later.
axum-extra = { version = "0.9", features = ["cookie"] }
# PKCE: the `code_challenge` is `base64url(sha256(code_verifier))`. We use
# the `URL_SAFE_NO_PAD` engine. SHA-256 already comes via `sha2`.
base64 = "0.22"
# `http` is re-exported by axum/rmcp but we use `http::request::Parts` directly
# in the tool layer (rmcp injects it into `RequestContext.extensions`), so a
# top-level dep keeps the import path stable.
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
# HTTP client for talking to MAS. rustls-only — no system OpenSSL needed,
# slimmer distroless image. JSON feature for ergonomic response parsing.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# SHA-256 of access tokens for cache keys — never store the raw token as a
# hashmap key, even in-process, to reduce blast radius of a memory dump.
sha2 = "0.10"
# Constant-time string comparison for auth headers, kept simple by leaning on
# subtle's idioms. Used by the bearer extractor.
subtle = "2.6"
# Used only for generating Matrix transaction ids (random suffix on a
# millisecond timestamp). Not security-sensitive — Synapse de-duplicates on
# txn id, so what matters is uniqueness, not unpredictability.
rand = "0.8"
# Official MCP Rust SDK. `transport-streamable-http-server` umbrella enables
# session manager + http transport + worker bits we need to mount the service
# via `axum::Router::nest_service("/mcp", ...)`.
rmcp = { version = "1.7", features = ["transport-streamable-http-server"] }
# Matrix client SDK. We pull in just the pieces needed for E2EE-aware
# tools: vodozemac (olm/megolm) via `e2e-encryption`, the encrypted
# on-disk SQLite store via `sqlite`, and markdown rendering for outgoing
# message bodies. Default features are off so we don't drag in native
# TLS (we use rustls everywhere), SSO redirects (we authenticate via
# OAuth bearer), qrcode, or other unneeded surface.
matrix-sdk = { version = "0.17", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    # `bundled-sqlite` statically links sqlite into the binary. The
    # distroless `cc-debian12:nonroot` runtime doesn't ship
    # libsqlite3.so.0, and adding it would mean switching to a fatter
    # base image. Bundling adds ~700 KiB and one extra compile of
    # sqlite (already cached after the first build), which is a fine
    # trade for keeping the runtime image at ~25 MiB.
    "bundled-sqlite",
    "markdown",
] }
# `ruma-events` types we pull off the SDK's room timelines (e.g.
# `RoomMessageEventContent` for sending m.text bodies). Pinned to the
# same Matrix-spec generation as matrix-sdk 0.17. 0.15 is the API line
# matrix-sdk 0.17 re-exports under `matrix_sdk::ruma::*`.
ruma = { version = "0.15", features = ["client-api-c", "html"] }
# HKDF for deriving the per-user store-cipher key from the shared pepper.
# `salt = mxid`, `ikm = pepper`, `info = "matrix-mcp-store-cipher v1"`.
hkdf = "0.12"
# Hex-encoding the SHA-256 of the mxid for the on-disk store directory
# name (avoid putting raw `@user:host` chars on the filesystem).
hex = "0.4"

[dev-dependencies]
# Mock HTTP server for MAS introspection tests. Used by `cargo test` only;
# never linked into the release binary.
wiremock = "0.6"

[profile.release]
# Optimise for binary size + decent perf; we're an HTTP server, not a CPU
# crucher. Slimmer binaries → smaller container images, faster cold starts.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[lints.clippy]
# Reasonable defaults; tighten as the codebase grows.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
# Acceptable in pragma-heavy code:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "forbid"
