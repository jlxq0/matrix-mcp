name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features --locked

  audit:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit && cargo audit

  deny:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check bans licenses sources }

  # docker job runs directly on the Pada VM (host mode) — the `pada-host`
  # runner label has no `docker://` image mapping, so act_runner skips the
  # job-container layer entirely and the host's docker daemon is reachable
  # at /var/run/docker.sock natively. This sidesteps act_runner v6.4.0's
  # buggy `docker_host: automount` setting.
  docker:
    runs-on: pada-host
    needs: [clippy, test]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Verify docker access
        run: docker info | head -8
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Login to Forgejo registry (primary)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: forge.oddie.app
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to GHCR (backup)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: jlxq0
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            {
              echo 'tags<<EOF'
              echo "forge.oddie.app/julian/matrix-mcp:${V}"
              echo "forge.oddie.app/julian/matrix-mcp:latest"
              echo "ghcr.io/jlxq0/matrix-mcp:${V}"
              echo "ghcr.io/jlxq0/matrix-mcp:latest"
              echo 'EOF'
              echo 'push=true'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags=forge.oddie.app/julian/matrix-mcp:ci-${GITHUB_SHA}"
              echo 'push=false'
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
