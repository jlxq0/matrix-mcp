# CI — runs on the Pada Forgejo Actions runner.
# Migrated from .github/workflows/ci.yml on 2026-05-17. Differences from
# the GHA original:
# - Cache backend: GHA cache (`type=gha`) doesn't exist in Forgejo Actions;
#   docker layer cache is a registry-backed cache on the Forgejo registry.
# - `rustsec/audit-check` removed: it uses GitHub Check Runs API which
#   Forgejo doesn't implement. Replaced with `cargo install cargo-audit &&
#   cargo audit` so we still get the audit, just without the fancy
#   check-run UI.
# - `runs-on: ubuntu-22.04` not `ubuntu-latest` because the act-latest
#   image had a flaky moment during runner bring-up (kept for the future
#   when we verify it stabilises).
# - Docker images published to BOTH forge.oddie.app/julian/matrix-mcp
#   (primary) and ghcr.io/jlxq0/matrix-mcp (backup).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install --locked cargo-audit
          cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  docker-build:
    name: docker build (PR/main cache warmth)
    runs-on: ubuntu-22.04
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - name: Build only — primary registry as cache target
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: forge.oddie.app/julian/matrix-mcp:ci-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=registry,ref=forge.oddie.app/julian/matrix-mcp:buildcache
          cache-to: type=registry,ref=forge.oddie.app/julian/matrix-mcp:buildcache,mode=max

  docker-publish:
    name: docker publish (tag → primary + mirror)
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - name: Login to Forgejo registry (primary)
        uses: docker/login-action@v3
        with:
          registry: forge.oddie.app
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to GHCR (backup mirror)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: jlxq0
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          {
            echo 'tags<<EOF'
            echo "forge.oddie.app/julian/matrix-mcp:${VERSION}"
            echo "forge.oddie.app/julian/matrix-mcp:latest"
            echo "ghcr.io/jlxq0/matrix-mcp:${VERSION}"
            echo "ghcr.io/jlxq0/matrix-mcp:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push to both registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=registry,ref=forge.oddie.app/julian/matrix-mcp:buildcache
          cache-to: type=registry,ref=forge.oddie.app/julian/matrix-mcp:buildcache,mode=max
