name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features --locked

  audit:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit && cargo audit

  deny:
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check bans licenses sources }

  # docker job uses buildctl talking to the Pada VM's buildkitd over TCP
  # (tcp://host.docker.internal:1234). We use buildctl directly rather
  # than `docker buildx` because buildx v0.33 (bundled in catthehacker
  # image) hangs on plain-TCP remote endpoints.
  docker:
    runs-on: ubuntu-22.04
    needs: [clippy, test]
    permissions: { contents: read, packages: write }
    env:
      BUILDKIT_HOST: tcp://host.docker.internal:1234
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install buildctl
        run: |
          curl -sSL https://github.com/moby/buildkit/releases/download/v0.30.0/buildkit-v0.30.0.linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local --strip-components=0
          buildctl --version
      - name: Login to registries (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          G_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.GHCR_TOKEN }}" | base64 -w0)
          cat > ~/.docker/config.json <<JSON
          {
            "auths": {
              "forge.oddie.app": { "auth": "$F_AUTH" },
              "ghcr.io":         { "auth": "$G_AUTH" }
            }
          }
          JSON
      - name: Build (and push on tag)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            TAGS="forge.oddie.app/julian/matrix-mcp:${V},forge.oddie.app/julian/matrix-mcp:latest,ghcr.io/jlxq0/matrix-mcp:${V},ghcr.io/jlxq0/matrix-mcp:latest"
            PUSH=true
          else
            TAGS="forge.oddie.app/julian/matrix-mcp:ci-${GITHUB_SHA::8}"
            PUSH=false
          fi
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output "type=image,\"name=${TAGS}\",push=${PUSH}"
