name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # `audiopus_sys` defaults to dynamic linking on Linux/glibc, which
  # would make our distroless runtime image require libopus.so. Force
  # static so the same library shipped in the binary is what runs.
  OPUS_STATIC: "1"

jobs:
  # All cargo checks in one job. On a fast runner the cache hit + shared
  # incremental state crushes the GHA-style "one job per check" pattern.
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # `opus` (via audiopus_sys) builds libopus from C source at
      # crate-build time using CMake. Even `cargo clippy` runs the
      # build script, so cmake must be present on the runner for any
      # cargo step to succeed.
      - name: Install C build deps for libopus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: audit
        run: |
          [ -x ~/.cargo/bin/cargo-audit ] || cargo install --locked cargo-audit
          cargo audit
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1  # v2
        with: { command: check bans licenses sources }

  # buildctl talks to Pada's buildkitd over TCP. Registry-backed layer cache
  # so a rebuild reuses unchanged layers across runs.
  docker:
    runs-on: ubuntu-22.04
    needs: cargo
    permissions: { contents: read, packages: write }
    env:
      BUILDKIT_HOST: tcp://10.0.1.57:1234
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      - name: Install buildctl
        env:
          BUILDKIT_VERSION: v0.30.0
          # sha256 of buildkit-v0.30.0.linux-amd64.tar.gz from
          # github.com/moby/buildkit/releases/tag/v0.30.0
          BUILDKIT_SHA256: 2da148c50540409988c837e62b72176e4a9ad7855548a2dd6ea1cd0c0d2d360d
        run: |
          set -euo pipefail
          TARBALL="/tmp/buildkit.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local --strip-components=0 -f "$TARBALL"
          rm -f "$TARBALL"
          buildctl --version
      # Forgejo login only on trusted refs (main + tags). PR builds do
      # a cold build with no buildcache import — slower, but no
      # package-write PAT lands in the runner's docker config for a
      # PR-triggered job to potentially exfiltrate.
      # GHCR login only when we're about to push real tags.
      - name: Login to Forgejo registry
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "julian" "${{ secrets.FORGE_PUSH_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"forge.oddie.app\":{\"auth\":\"$F_AUTH\"}}}" > ~/.docker/config.json
      - name: Login to GHCR (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          G_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.GHCR_TOKEN }}" | base64 -w0)
          jq --arg a "$G_AUTH" '.auths["ghcr.io"] = {auth: $a}' ~/.docker/config.json > /tmp/d && mv /tmp/d ~/.docker/config.json
      - name: Build (and push on tag)
        run: |
          set -euo pipefail
          CACHE_REF="forge.oddie.app/julian/matrix-mcp:buildcache"
          # Cache import/export only on trusted refs (main + release
          # tags). PRs build cold — they can't poison the cache that
          # the next tag build pulls, and they don't need the Forgejo
          # PAT to be present in the runner's docker config.
          IMPORT_CACHE_ARG=()
          EXPORT_CACHE_ARG=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            TAGS="forge.oddie.app/julian/matrix-mcp:${V},forge.oddie.app/julian/matrix-mcp:latest,ghcr.io/jlxq0/matrix-mcp:${V},ghcr.io/jlxq0/matrix-mcp:latest"
            PUSH=true
            IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
            EXPORT_CACHE_ARG=(--export-cache "type=registry,ref=${CACHE_REF},mode=max")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="forge.oddie.app/julian/matrix-mcp:ci-${GITHUB_SHA::8}"
            PUSH=false
            IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
            EXPORT_CACHE_ARG=(--export-cache "type=registry,ref=${CACHE_REF},mode=max")
          else
            TAGS="forge.oddie.app/julian/matrix-mcp:ci-${GITHUB_SHA::8}"
            PUSH=false
          fi
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            "${IMPORT_CACHE_ARG[@]}" \
            "${EXPORT_CACHE_ARG[@]}" \
            --output "type=image,\"name=${TAGS}\",push=${PUSH}"
