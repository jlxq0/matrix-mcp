name: Weekly Cargo Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: cargo audit
        id: audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: cargo deny
        id: deny
        uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2
        with:
          command: check bans licenses sources
        continue-on-error: true

      - name: Open issue on failure
        if: steps.audit.outcome == 'failure' || steps.deny.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="weekly cargo audit found new advisories — ${DATE}"

          # Check for an existing open issue with this exact title to avoid duplicates
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"${TITLE}\" in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Open issue #${EXISTING} already exists for today — skipping."
            exit 0
          fi

          AUDIT_STATUS="${{ steps.audit.outcome }}"
          DENY_STATUS="${{ steps.deny.outcome }}"

          BODY="## Weekly cargo audit failed

          | Check | Result |
          |-------|--------|
          | \`cargo audit\` | ${AUDIT_STATUS} |
          | \`cargo deny\` | ${DENY_STATUS} |

          **Action run:** ${RUN_URL}

          Review the run log above, update or patch affected dependencies, and close this issue once resolved."

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TITLE}" \
            --body "${BODY}" \
            --label "security"
